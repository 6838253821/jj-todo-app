{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth card"><h1>Welcome back</h1><p class="muted">Log in to your personal task list.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label><input id="username" name="username" maxlength="50" autocomplete="username" required>
  <label for="password">Password</label><input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
  <button>Log in</button>
</form><p>New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></section>
{% endblock %}
